---
permalink:  /conference/
---

<html>
  <head>
    {% include head.html %}
  </head>
  <body>
    {% include header.html %}
    <div class="container">
      <div class="page-header" id="conf-title">
        <div class="row">
          <div class="col-sm-12">
            <h1>
              <span id="conf-title-href"></span>
              <span id="twitter-box"></span>
            </h1>
            <h3 id="conf-full-name">
            </h3>
          </div>
        </div>
        <div class="row">
          <div class="col-sm-12">
            <span id="conf-subs" title="Conference subjects"></span>
          </div>
        </div>
      </div>
      <div id="page-content">
        <div id="conf-key-facts" class="row">
          <div class="col-12">
            <img src="{{site.baseurl}}/static/img/084-calendar.svg" class="badge-link" />
            <span id="conf-date"></span>.
          </div>
          <div class="col-12">
            <img src="{{site.baseurl}}/static/img/072-location.svg" class="badge-link" />
            <a id="conf-place" target="_blank" nohref></a>.
          </div>
          <div class="col-12">
            <img src="{{site.baseurl}}/static/img/203-earth.svg" class="badge-link" />
            <a id="conf-website" target="_blank" nohref></a>
          </div>
          <div id="conf-paperslink-div" class="col-12">
            <img src="{{site.baseurl}}/static/img/033-books.svg" class="badge-link" />
            Accepted Papers:
            <a id="conf-paperslink" target="_blank" nohref></a>
          </div>
          <div id="conf-pwclink-div" class="col-12">
            <div class="icon-inner pwc-icon"><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" class="s-ion-icon"><path d="M88 128h48v256H88zM232 128h48v256h-48zM160 144h48v224h-48zM304 144h48v224h-48zM376 128h48v256h-48z"></path><path d="M104 104V56H16v400h88v-48H64V104zM408 56v48h40v304h-40v48h88V56z"></path></svg></div>
            Papers with Code:
            <a id="conf-pwclink" target="_blank" nohref></a>
          </div>
        </div>
        <p id="conf-note" class="meta"></p>
        <div id="conf-track-summary"></div>
        <div id="conf-track-deadlines"></div>
      </div>
        <hr>
        <footer>
          {% include footer.html %}
        </footer>
    </div>
    <script type="text/javascript" charset="utf-8">
    $(function() {
      {% include load_data.js %}
      var id = new URL(window.location).searchParams.get('id');
      var conferences = {{ site.data.conferences | jsonify }};
      var conf = conferences.find(function(c) { return c.id === id; });
      if (!conf) {
        $('#conf-title-href').text('Conference not found');
        $('#page-content').text('Choose a conference from the Countdowns page.');
        return;
      }
      $('#conf-title-href').text(DeadlineTracks.title(conf));
      $('#conf-full-name').text(conf.full_name || '');
      $('#conf-date').text(conf.date);
      $('#conf-place').text(conf.place).attr('href', 'https://maps.google.com/?q=' + encodeURIComponent(conf.place));
      $('#conf-website').text(conf.link).attr('href', conf.link);
      $('#conf-note').text(conf.note || '');
      ['paperslink','pwclink'].forEach(function(key) {
        if (conf[key]) $('#conf-' + key).text(conf[key]).attr('href', conf[key]);
        else $('#conf-' + key + '-div').hide();
      });
      conf.sub.split(',').forEach(function(sub) {
        var badge = document.createElement('span');badge.className='conf-sub';badge.textContent=sub2name[sub.trim()] || sub.trim();
        document.getElementById('conf-subs').appendChild(badge);
      });
      var previousStatus;
      function refresh() {
        var now = Date.now();
        var info=DeadlineTracks.summary(conf,now);
        $('#conf-track-summary').text(info.next ? 'Next: ' + info.next.track.label + ' · ' + DeadlineTracks.countdown(info.next.date,now) : info.group === 'planning' ? 'Submission dates to be announced' : 'No upcoming confirmed submission deadline');
        var signature=conf.tracks.map(function(t) {var d=DeadlineTracks.parse(t);return d && d.valueOf()>now;}).join();
        if (signature!==previousStatus) DeadlineTracks.renderTable(document.getElementById('conf-track-deadlines'),conf,now);
        previousStatus=signature;
      }
      refresh();setInterval(refresh,1000);
    });
    {% include google_analytics.js %}
    </script>
  </body>
</html>
